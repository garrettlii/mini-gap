[project]
name = "mini-gap"
version = "0.1.0"
description = "Laptop-scale Graph-as-Policy: LLM-authored skill graphs, MuJoCo rehearsal, learned skill-vs-policy arbitration, and Qwen fine-tuning."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "mujoco>=3.2",          # 3.2+ for MjSpec (used by gap/sim/model_builder.py)
  "numpy>=1.26",
  "scipy>=1.11",
  "pydantic>=2.6",
  "networkx>=3.2",
  "pyyaml>=6.0",
  "imageio[ffmpeg]>=2.34",
  "matplotlib>=3.8",
  "python-dotenv>=1.0",
  "scikit-learn>=1.4",    # arbiter + small fallback policies (Phase 6b)
]

[project.optional-dependencies]
# Apple Silicon only. Installed by scripts/setup_mac.sh via `uv sync --all-extras`.
mlx = [
  "mlx; sys_platform == 'darwin'",
  "mlx-lm; sys_platform == 'darwin'",
  "mlx-lm-lora; sys_platform == 'darwin'",
  "mlx-vlm; sys_platform == 'darwin'",
]
llm = ["openai"]

[dependency-groups]
dev = ["pytest>=8", "ipykernel", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gap"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "phase(n): test belongs to build phase n; skipped unless --phase >= n",
  "slow: long-running (100-seed sweeps); skipped unless --runslow",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint.per-file-ignores]
# skill inputs/outputs/params are typed ClassVar on Skill (base.py); ruff can't see the base
"gap/skills/*.py" = ["RUF012"]
